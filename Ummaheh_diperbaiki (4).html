<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--card);border-right:1px solid var(--line);padding:22px 16px;position:fixed;top:0;bottom:0}.brand{font-size:25px;font-weight:900;color:var(--primary);padding:6px 10px 25px}.nav{display:grid;gap:7px}.nav button{background:transparent;text-align:left;padding:13px 14px;border-radius:13px;color:var(--muted);font-weight:700}.nav button.active,.nav button:hover{background:var(--soft);color:var(--primary2)}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1250px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.welcome{font-size:27px;font-weight:900}.subtitle{color:var(--muted);margin-top:5px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--soft);background:var(--soft)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:13px;font-weight:700}.stat .value{font-size:23px;font-weight:900;margin-top:8px}.income{color:var(--green)}.expense{color:var(--red)}.balance{color:var(--primary2)}.section{margin-top:20px}.section h2{font-size:18px;margin:0 0 12px}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}.chart{height:250px;display:flex;align-items:flex-end;gap:12px;padding:15px 4px 0}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:min(35px,70%);background:linear-gradient(180deg,var(--primary),var(--primary2));border-radius:9px 9px 3px 3px;min-height:4px}.barlabel{font-size:11px;color:var(--muted)}.barvalue{font-size:10px;color:var(--muted);font-weight:700}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-top:3px}.amount{font-weight:900}.empty{text-align:center;color:var(--muted);padding:30px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.btn{padding:10px 14px;border-radius:12px;background:var(--soft);color:var(--primary2);font-weight:800}.btn.primary{background:var(--primary);color:#fff}.btn.danger{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}.form{display:grid;gap:12px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}.field input::placeholder{color:var(--muted)}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.card,.main{min-width:0}.field input[type=file]{padding:9px}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted)}.pill{padding:5px 9px;border-radius:99px;background:var(--soft);font-size:11px;font-weight:800}.setting{display:grid;gap:18px}.theme{display:flex;gap:10px;flex-wrap:wrap}.theme button{padding:12px 16px;border:2px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font-weight:800}.theme button.selected{border-color:var(--primary);color:var(--primary)}.profile{display:flex;align-items:center;gap:15px}.profile img{width:75px;height:75px;border-radius:50%;object-fit:cover;background:var(--soft)}.toast{position:fixed;right:20px;bottom:20px;background:#30232b;color:#fff;padding:12px 16px;border-radius:12px;display:none}.mobilebar{display:none}
@media(max-width:850px){.side{display:none}.main{margin:0;width:100%;padding:18px 15px 85px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.mobilebar{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:5}.mobilebar button{padding:9px 2px;background:var(--card);color:var(--muted);font-size:10px}.mobilebar button.active{color:var(--primary);font-weight:900}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{margin-bottom:18px}.welcome{font-size:22px}}

/* UX refresh: clearer hierarchy, accessible focus states, and calmer surfaces */
:root{--shadow:0 8px 24px rgba(91,45,69,.07);--radius:20px}
html{scroll-behavior:smooth}
body{line-height:1.5;letter-spacing:-.01em}
button,input,select{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 35%,transparent);outline-offset:2px}

.mobilebar button{min-height:48px;border-radius:10px;line-height:1.2;white-space:normal}
.mobilebar button.active{background:var(--soft)}
.empty{line-height:1.6}
.toast{z-index:20;box-shadow:0 8px 25px rgba(0,0,0,.15);max-width:calc(100vw - 32px)}
@media(min-width:1200px){.grid{gap:18px}.section{margin-top:24px}.two{gap:18px}}
@media(max-width:850px){.main{padding:20px 14px calc(92px + env(safe-area-inset-bottom))}.grid{gap:10px}.card{padding:15px;border-radius:17px}.stat .value{font-size:clamp(17px,4.5vw,22px)}.two{gap:12px}.section{margin-top:15px}.quick-actions{margin:0 0 16px}.quick-actions .btn{flex:1}.chart{gap:4px;padding-left:0;padding-right:0}.barvalue{font-size:9px;overflow-wrap:anywhere;text-align:center}.row{align-items:flex-start}.amount{white-space:normal;text-align:right}.top{align-items:flex-start}.avatar{flex-shrink:0}}
@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.welcome{font-size:20px}.mobilebar button{font-size:9px}.stat .value{font-size:16px}.card{padding:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}

 .mobilebar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:53px;padding:5px 1px;background:transparent;color:var(--muted);font-size:10px;font-weight:700;border-radius:13px}

.quick-add-menu .btn{white-space:nowrap}
@media(max-width:850px){.app-topbar{margin-bottom:10px}.app-topbar-label{display:none}.settings-top{font-size:12px;min-height:36px;padding:7px 11px}.fab{right:18px;bottom:calc(82px + env(safe-area-inset-bottom));width:58px;height:58px}.quick-add-menu{right:18px;bottom:calc(148px + env(safe-area-inset-bottom))}.mobile-brand{margin-top:0}}

<body>
<div class="app">
<aside class="side"><div class="brand">♡ Ummaheh</div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="app-topbar"><div class="app-topbar-label">♡ Ummaheh</div><button class="btn settings-top" onclick="current='settings';render()" aria-label="Buka pengaturan">⚙ Pengaturan</button></div><div class="mobile-brand"><div class="mobile-brand-mark">♡</div><div><div class="mobile-brand-name">Ummaheh</div><div class="mobile-brand-sub">Catatan keuanganmu</div></div><div class="mobile-brand-spacer"></div><div class="mobile-brand-date" id="todayLabel"></div></div><div id="page"></div></main>
</div>
<div class="mobilebar" id="mobilebar"></div><div class="quick-add-menu" id="quickAddMenu" hidden><button class="btn primary" onclick="openQuickTransaction('income')">↗ Catat pemasukan</button><button class="btn" onclick="openQuickTransaction('expense')">↘ Catat pengeluaran</button></div><button class="fab" id="fabAdd" onclick="toggleQuickAdd()" aria-label="Tambah pemasukan atau pengeluaran" title="Tambah transaksi">＋</button><div class="toast" id="toast"></div>
<script>
const KEY="ummaheh_v1";
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function localISODate(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}
function validISODate(value){if(typeof value!=="string"||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(value))return false;const [y,m,d]=value.split("-").map(Number);const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d}
function safeLoad(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){console.warn("Data lokal tidak dapat dibaca",e);return null}}
let db=safeLoad()||{
 profile:{name:"Umma",photo:"",theme:"pink"},
 incomeCats:["Gaji","Bonus","Bisnis","Hadiah","Lainnya"],
 expenseCats:["Makanan","Transportasi","Belanja","Tagihan","Kesehatan","Hiburan","Lainnya"],
 banks:[{name:"Bank Utama",balance:0},{name:"Cash",balance:0}],
 savings:[{name:"Tabungan Utama",target:10000000,balance:0}],
 subscriptions:[],debts:[],transactions:[]
};
let current="overview";
let dashboardMonth=new Date().getMonth();
let dashboardYear=new Date().getFullYear();
const menus=[["overview","⌂","Beranda"],["income","↗","Masuk"],["expense","↘","Keluar"],["bank","▤","Dompet"],["saving","♡","Tabungan"],["debt","⇄","Tagihan"],["settings","⚙","Lainnya"]];
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){console.error(e);alert("Data gagal disimpan. Penyimpanan browser mungkin penuh atau dinonaktifkan. Buat backup dan coba lagi.");return false}}
function normalizeDB(data){
  if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Format backup tidak valid");
  for(const k of ["incomeCats","expenseCats","banks","savings","subscriptions","debts","transactions"])if(!Array.isArray(data[k]))throw new Error("Bagian data tidak valid: "+k);
  if(!data.profile||typeof data.profile!=="object")throw new Error("Profil tidak valid");
  data.profile.name=String(data.profile.name||"Umma").slice(0,80);
  data.profile.photo=typeof data.profile.photo==="string"&&data.profile.photo.startsWith("data:image/")?data.profile.photo:"";
  data.profile.theme=["pink","dark","classic"].includes(data.profile.theme)?data.profile.theme:"pink";
  data.incomeCats=data.incomeCats.map(String).filter(Boolean).slice(0,100);
  data.expenseCats=data.expenseCats.map(String).filter(Boolean).slice(0,100);
  data.banks=data.banks.filter(x=>x&&typeof x==="object").map(x=>({name:String(x.name||"Rekening").slice(0,80),balance:Number.isFinite(Number(x.balance))?Number(x.balance):0}));
  data.savings=data.savings.filter(x=>x&&typeof x==="object").map(x=>({name:String(x.name||"Tabungan").slice(0,80),target:Math.max(0,Number(x.target)||0),balance:Math.max(0,Number(x.balance)||0)}));
  data.debts=data.debts.filter(x=>x&&typeof x==="object").map(x=>({name:String(x.name||"Hutang").slice(0,120),amount:Math.max(0,Number(x.amount)||0),due:String(x.due||""),paid:!!x.paid,paidFrom:x.paidFrom!==null&&x.paidFrom!==undefined&&Number.isInteger(Number(x.paidFrom))?Number(x.paidFrom):null}));
  data.subscriptions=data.subscriptions.filter(x=>x&&typeof x==="object").map(x=>({name:String(x.name||"Langganan").slice(0,120),amount:Math.max(0,Number(x.amount)||0),period:String(x.period||"Bulanan"),due:String(x.due||""),paidPeriod:String(x.paidPeriod||"")}));
  data.transactions=data.transactions.filter(x=>x&&typeof x==="object"&&["income","expense","transfer_out","transfer_in"].includes(x.type)).map(x=>({type:x.type,amount:Math.max(0,Number(x.amount)||0),date:String(x.date||localISODate()),category:String(x.category||"Lainnya").slice(0,100),title:String(x.title||"").slice(0,160),bankIndex:Number.isInteger(Number(x.bankIndex))?Number(x.bankIndex):0,accountKind:x.accountKind==="saving"?"saving":"bank",savingIndex:Number.isInteger(Number(x.savingIndex))?Number(x.savingIndex):null,pairId:typeof x.pairId==="string"?x.pairId:"",transferToIndex:Number.isInteger(Number(x.transferToIndex))?Number(x.transferToIndex):null}));
  if(!data.banks.length)data.banks=[{name:"Cash",balance:0}];
  if(!data.incomeCats.length)data.incomeCats=["Gaji","Lainnya"];
  if(!data.expenseCats.length)data.expenseCats=["Lainnya"];
  return data;
}
try{db=normalizeDB(db)}catch(e){console.warn("Data lokal tidak sesuai format; gunakan data awal.",e);db={profile:{name:"Umma",photo:"",theme:"pink"},incomeCats:["Gaji","Bonus","Bisnis","Hadiah","Lainnya"],expenseCats:["Makanan","Transportasi","Belanja","Tagihan","Kesehatan","Hiburan","Lainnya"],banks:[{name:"Bank Utama",balance:0},{name:"Cash",balance:0}],savings:[{name:"Tabungan Utama",target:10000000,balance:0}],subscriptions:[],debts:[],transactions:[]}}
function rupiah(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0)}
function total(type){return db.transactions.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount),0)}
function saldo(){return db.banks.reduce((sum,b,i)=>sum+bankBalance(i),0)}
function isCashAccount(b){return String(b?.name||"").trim().toLowerCase()==="cash"}
function saldoCash(){return db.banks.reduce((sum,b,i)=>sum+(isCashAccount(b)?bankBalance(i):0),0)}
function saldoBank(){return db.banks.reduce((sum,b,i)=>sum+(!isCashAccount(b)?bankBalance(i):0),0)}
function bankBalance(i){let b=db.banks[i];if(!b)return 0;let opening=Number(b.balance)||0;return opening+db.transactions.reduce((sum,x)=>{if(x.accountKind==="saving"||Number(x.bankIndex)!==i)return sum;return sum+((x.type==="income"||x.type==="transfer_in")?1:((x.type==="expense"||x.type==="transfer_out")?-1:0))*Number(x.amount||0)},0)}
function monthTx(){return db.transactions.filter(x=>{let z=new Date(x.date+"T00:00:00");return z.getMonth()===dashboardMonth&&z.getFullYear()===dashboardYear})}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function nav(){let a=document.getElementById("nav"),b=document.getElementById("mobilebar");a.innerHTML=b.innerHTML="";menus.forEach(([id,ic,label])=>{let x=document.createElement("button");x.className=current===id?"active":"";x.innerHTML=`<span class="nav-icon">${ic}</span><span>${label}</span>`;x.title=label;x.setAttribute("aria-label",label);x.onclick=()=>{current=id;render()};a.appendChild(x);let y=x.cloneNode(true);y.className=current===id?"active":"";y.onclick=()=>{current=id;render()};b.appendChild(y)})}
function stat(label,value,cls=""){return `<div class="card stat"><div class="label">${label}</div><div class="value ${cls}">${rupiah(value)}</div></div>`}
function chartHTML(){let now=new Date(),arr=[];for(let i=11;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),m=d.getMonth(),y=d.getFullYear();let inc=0,exp=0;db.transactions.forEach(x=>{let z=new Date(x.date+"T00:00:00");if(z.getMonth()===m&&z.getFullYear()===y){if(x.type==="income")inc+=Number(x.amount);else if(x.type==="expense")exp+=Number(x.amount)}});arr.push({label:d.toLocaleDateString("id-ID",{month:"short"}),inc,exp})}let max=Math.max(1,...arr.flatMap(x=>[x.inc,x.exp]));return `<div class="chart chart-year">${arr.map(x=>`<div class="barwrap"><div class="bar-pair"><div class="bar income-bar" title="Pemasukan ${rupiah(x.inc)}" style="height:${Math.max(2,x.inc/max*145)}px"></div><div class="bar expense-bar" title="Pengeluaran ${rupiah(x.exp)}" style="height:${Math.max(2,x.exp/max*145)}px"></div></div><div class="barlabel">${x.label}</div></div>`).join("")}</div><div class="chart-legend"><span><i class="legend-dot" style="background:#4da67c"></i>Pemasukan</span><span><i class="legend-dot" style="background:#d65c65"></i>Pengeluaran</span></div>`}
function overview(){let mt=monthTx(),inc=mt.filter(x=>x.type==="income").reduce((a,x)=>a+Number(x.amount),0),exp=mt.filter(x=>x.type==="expense").reduce((a,x)=>a+Number(x.amount),0);let years=[];let firstYear=Math.min(dashboardYear,...db.transactions.map(x=>Number(String(x.date||"").slice(0,4))||dashboardYear),new Date().getFullYear());for(let y=firstYear;y<=Math.max(new Date().getFullYear(),dashboardYear)+2;y++)years.push(y);let months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];return `<div class="top"><div><div class="welcome">Halo, ${escapeHTML(db.profile.name||"Umma")} 👋</div><div class="subtitle">Ini ringkasan keuanganmu.</div></div><img class="avatar" src="${db.profile.photo||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 rx=%2250%25%22 fill=%22%23fce6f2%22/%3E%3Ctext x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 font-size=%2224%22%3E♡%3C/text%3E%3C/svg%3E'}"></div></div>

<div class="card" style="margin-bottom:15px"><div class="toolbar" style="align-items:center;margin:0"><b style="margin-right:auto">Periode laporan</b><select aria-label="Pilih bulan" onchange="dashboardMonth=Number(this.value);render()" style="padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)">${months.map((m,i)=>`<option value="${i}" ${dashboardMonth===i?'selected':''}>${m}</option>`).join("")}</select><select aria-label="Pilih tahun" onchange="dashboardYear=Number(this.value);render()" style="padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text)">${years.map(y=>`<option value="${y}" ${dashboardYear===y?'selected':''}>${y}</option>`).join("")}</select></div></div>
<div class="grid">${stat("Pemasukan • "+months[dashboardMonth],inc,"income")}${stat("Pengeluaran • "+months[dashboardMonth],exp,"expense")}${stat("Saldo Bank / Rekening",saldoBank(),"balance")}${stat("Saldo Cash",saldoCash(),"balance")}${stat("Total Tabungan",db.savings.reduce((a,x)=>a+Number(x.balance),0),"balance")}</div>
<div class="section two"><div class="card"><h2>Pergerakan 1 Tahun</h2>${chartHTML()}<div style="font-size:12px;color:var(--muted)">Perbandingan pemasukan dan pengeluaran selama 12 bulan terakhir.</div></div>
<div class="card"><h2>Ringkasan ${months[dashboardMonth]} ${dashboardYear}</h2><div class="list">${stat("Pemasukan",inc,"income")}${stat("Pengeluaran",exp,"expense")}<div class="row"><span>Selisih periode</span><b class="${inc-exp>=0?'income':'expense'}">${rupiah(inc-exp)}</b></div></div></div></div>

function monthlyBars(){
  let now=new Date(),arr=[];
  for(let i=11;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1),m=d.getMonth(),y=d.getFullYear(),inc=0,exp=0;
    db.transactions.forEach(x=>{let z=new Date(x.date+"T00:00:00");if(z.getMonth()===m&&z.getFullYear()===y){if(x.type==="income")inc+=Number(x.amount);else if(x.type==="expense")exp+=Number(x.amount)}});
    arr.push({l:d.toLocaleDateString("id-ID",{month:"short"}),inc,exp});
  }
  let max=Math.max(1,...arr.flatMap(x=>[x.inc,x.exp]));
  return `<div class="chart chart-year chart-year-large">${arr.map(x=>`<div class="barwrap"><div class="bar-pair"><div class="bar income-bar" title="Pemasukan ${rupiah(x.inc)}" style="height:${Math.max(2,x.inc/max*145)}px"></div><div class="bar expense-bar" title="Pengeluaran ${rupiah(x.exp)}" style="height:${Math.max(2,x.exp/max*145)}px"></div></div><div class="barlabel">${x.l}</div></div>`).join("")}</div><div class="chart-legend"><span><i class="legend-dot" style="background:#4da67c"></i>Pemasukan</span><span><i class="legend-dot" style="background:#d65c65"></i>Pengeluaran</span></div>`;
}
function txList(arr){if(!arr.length)return '<div class="empty">Belum ada transaksi.</div>';return `<div class="list">${arr.map(x=>{let idx=db.transactions.indexOf(x);return `<div class="row"><div><b>${escapeHTML(x.title||x.category)}</b><small>${escapeHTML(x.category)} • ${escapeHTML(x.date)} • Sumber/rekening: ${x.accountKind==="saving"?escapeHTML(db.savings[Number(x.savingIndex)]?.name||"Tabungan"):escapeHTML(db.banks[Number(x.bankIndex)]?.name||"Rekening tidak diketahui")}</small></div><div style="display:grid;justify-items:end;gap:7px"><div class="amount ${(x.type==="income"||x.type==="transfer_in")?"income":"expense"}">${(x.type==="income"||x.type==="transfer_in")?"+":"−"} ${rupiah(x.amount)}</div><div style="display:flex;gap:5px"><button class="btn" onclick="editTx(${idx})" aria-label="Edit transaksi">✎ Edit</button><button class="btn danger" onclick="delTx(${idx})" aria-label="Hapus transaksi">Hapus</button></div></div></div>`}).join("")}</div>`}
function transactionPage(type){let isIn=type==="income",title=isIn?"Pemasukan":"Pengeluaran",cats=isIn?db.incomeCats:db.expenseCats;return `<div class="top"><div><div class="welcome">${title}</div><div class="subtitle">${isIn?"Pilih rekening tujuan agar saldo uang bertambah.":"Pilih rekening atau metode pembayaran agar saldo uang berkurang."}</div></div></div><div class="two"><div class="card"><h2>Tambah ${title}</h2><form class="form" onsubmit="addTx(event,'${type}')"><div class="formgrid"><div class="field"><label>NOMINAL (RP)</label><input name="amount" type="number" min="1" step="1" placeholder="Contoh: 500000" required></div><div class="field"><label>TANGGAL</label><input name="date" type="date" value="${localISODate()}" required></div><div class="field"><label>KATEGORI</label><select name="category">${cats.map(x=>`<option>${escapeHTML(x)}</option>`).join("")}</select></div><div class="field"><label>${isIn?"UANG MASUK KE REKENING":"BAYAR DARI REKENING / METODE"}</label><select name="bankIndex" required>${db.banks.map((b,i)=>`<option value="${i}">${b.name} — saldo ${rupiah(bankBalance(i))}</option>`).join("")}</select></div><div class="field full"><label>JUDUL / KETERANGAN</label><input name="title" placeholder="Contoh: Gaji bulan ini"></div></div><button class="btn primary">Simpan ${title}</button></form></div><div class="card">${stat("Total "+title+" (semua waktu)",total(type),isIn?"income":"expense")}<h2 style="margin-top:18px">Riwayat</h2>${txList(db.transactions.filter(x=>x.type===type).slice().reverse().slice(0,10))}</div></div>`}
function bankPage(){return `<div class="top"><div><div class="welcome">Dompet & Saldo</div><div class="subtitle">Setiap uang masuk/keluar tercatat pada rekening sumbernya. Untuk memindahkan uang, pilih rekening asal dan tujuan.</div></div></div><div class="grid">${db.banks.map((b,i)=>`<div class="card stat"><div class="label">${escapeHTML(b.name)}</div><div class="value balance">${rupiah(bankBalance(i))}</div><small style="color:var(--muted)">Saldo awal: ${rupiah(b.balance)}</small><br><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px"><button class="btn" onclick="editBank(${i})">Ubah saldo awal</button><button class="btn danger" onclick="deleteBank(${i})">Hapus rekening</button></div></div>`).join("")}</div><div class="two section"><div class="card"><h2>Pindah saldo antar rekening</h2><p class="subtitle">Contoh: uang dari Bank Utama dipindahkan ke Cash. Bank Utama berkurang dan Cash bertambah dengan nominal yang sama.</p><form class="form" onsubmit="transferWallet(event)"><div class="formgrid"><div class="field"><label>REKENING ASAL (SALDO BERKURANG)</label><select name="from" required>${db.banks.map((b,i)=>`<option value="${i}">${escapeHTML(b.name)} — ${rupiah(bankBalance(i))}</option>`).join("")}</select></div><div class="field"><label>REKENING TUJUAN (SALDO BERTAMBAH)</label><select name="to" required>${db.banks.map((b,i)=>`<option value="${i}" ${i===1?'selected':''}>${escapeHTML(b.name)} — ${rupiah(bankBalance(i))}</option>`).join("")}</select></div><div class="field full"><label>NOMINAL (RP)</label><input name="amount" type="number" min="1" step="1" placeholder="Contoh: 100000" required></div><div class="field full"><label>KETERANGAN</label><input name="title" placeholder="Contoh: Ambil uang tunai dari bank"></div></div><button class="btn primary">Pindahkan Saldo</button></form></div><div class="card"><h2>Tambah rekening/dompet</h2><form class="form" onsubmit="addBank(event)"><div class="field"><label>NAMA REKENING</label><input name="name" placeholder="BCA / Cash / E-wallet" required></div><div class="field"><label>SALDO AWAL (RP)</label><input name="balance" type="number" min="0" step="1" value="0" required></div><button class="btn primary">Tambah Rekening</button></form><h2 style="margin-top:20px">Riwayat perpindahan saldo</h2>${txList(db.transactions.filter(x=>x.type==='transfer_out'||x.type==='transfer_in').slice().reverse().slice(0,8))}</div></div>`}
function savingPage(){return `<div class="top"><div><div class="welcome">Tabungan</div><div class="subtitle">Edit tabungan utama atau atur target tabunganmu.</div></div></div><div class="grid">${db.savings.map((s,i)=>{let p=Math.min(100,s.target?Number(s.balance)/Number(s.target)*100:0);return `<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b>${escapeHTML(s.name)}</b><button class="btn" onclick="editSaving(${i})" aria-label="Edit ${s.name}">✎ Edit</button></div><div class="value balance">${rupiah(s.balance)}</div><small style="color:var(--muted)">Target ${rupiah(s.target)}</small><div style="height:9px;background:var(--soft);border-radius:99px;margin:14px 0"><div style="width:${p}%;height:100%;background:var(--primary);border-radius:99px"></div></div><small>${p.toFixed(0)}% tercapai</small><br><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="addSaving(${i})">+ Setor</button><button class="btn" onclick="withdrawSaving(${i})">− Tarik</button><button class="btn danger" onclick="delSaving(${i})">Hapus</button></div></div>`}).join("")}</div><div class="section card"><h2>Target tabungan baru</h2><form class="formgrid" onsubmit="addSavingTarget(event)"><div class="field"><label>NAMA TARGET</label><input name="name" placeholder="Liburan / Dana darurat" required></div><div class="field"><label>TARGET (RP)</label><input name="target" type="number" min="1" required></div><button class="btn primary">Buat Target</button></form></div>`}
function debtPage(){const periodFor=s=>s.period==="Tahunan"?String(s.due||"").slice(0,4):String(s.due||"").slice(0,7);return `<div class="top"><div><div class="welcome">Tagihan & Langganan</div><div class="subtitle">Pembayaran harus memilih sumber saldo. Setelah dibayar, saldo rekening/dompet asal otomatis berkurang dan tercatat di riwayat pengeluaran.</div></div></div><div class="two"><div class="card"><h2>Tagihan / Hutang</h2>${db.debts.length?db.debts.map((d,i)=>`<div class="row"><div><b>${escapeHTML(d.name)}</b><small>Jatuh tempo: ${escapeHTML(d.due)}</small><small>${d.paid?'✓ Lunas':'Belum dibayar'}${d.paid&&db.banks[d.paidFrom]?' • Dibayar dari: '+escapeHTML(db.banks[d.paidFrom].name):''}</small></div><div style="display:grid;justify-items:end;gap:6px"><div class="amount ${d.paid?'income':'expense'}">${rupiah(d.amount)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${d.paid?'':`<button class="btn primary" onclick="payDebt(${i})">Bayar</button>`}<button class="btn" onclick="editDebt(${i})">Edit</button><button class="btn danger" onclick="delDebt(${i})">Hapus</button></div></div></div>`).join(''):'<div class="empty">Belum ada tagihan atau hutang.</div>'}<hr style="border:0;border-top:1px solid var(--line)"><form class="formgrid" onsubmit="addDebt(event)"><div class="field"><label>NAMA TAGIHAN / HUTANG</label><input name="name" required></div><div class="field"><label>NOMINAL (RP)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>JATUH TEMPO</label><input name="due" type="date" required></div><button class="btn primary">Tambah Tagihan</button></form></div><div class="card"><h2>Langganan</h2>${db.subscriptions.length?db.subscriptions.map((sub,i)=>{const paid=!!sub.paidPeriod&&sub.paidPeriod===periodFor(sub);return `<div class="row"><div><b>${escapeHTML(sub.name)}</b><small>${escapeHTML(sub.period)} • Jatuh tempo: ${escapeHTML(sub.due)}</small><small>${paid?'✓ Periode ini sudah dibayar':'Belum dibayar untuk periode ini'}</small></div><div style="display:grid;justify-items:end;gap:6px"><div class="amount ${paid?'income':'expense'}">${rupiah(sub.amount)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${paid?'':`<button class="btn primary" onclick="paySub(${i})">Bayar</button>`}<button class="btn" onclick="editSub(${i})">Edit</button><button class="btn danger" onclick="delSub(${i})">Hapus</button></div></div></div>`}).join(''):'<div class="empty">Belum ada langganan.</div>'}<hr style="border:0;border-top:1px solid var(--line)"><form class="formgrid" onsubmit="addSub(event)"><div class="field"><label>NAMA LANGGANAN</label><input name="name" placeholder="Internet, streaming..." required></div><div class="field"><label>NOMINAL (RP)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>PERIODE</label><select name="period"><option>Bulanan</option><option>Tahunan</option></select></div><div class="field"><label>TANGGAL TAGIHAN</label><input name="due" type="date" required></div><button class="btn primary">Tambah Langganan</button></form><p class="subtitle">Untuk langganan berulang, ubah tanggal tagihan ke periode berikutnya setelah siklus baru dimulai.</p></div></div>`}
function settings(){return `<div class="top"><div><div class="welcome">Pengaturan</div><div class="subtitle">Personalisasi Ummaheh sesuai kebutuhanmu.</div></div></div><div class="card setting"><div class="profile"><img id="photoPreview" src="${db.profile.photo||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2275%22 height=%2275%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 rx=%2250%25%22 fill=%22%23fce6f2%22/%3E%3Ctext x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 font-size=%2235%22%3E♡%3C/text%3E%3C/svg%3E'}"><div><b>Profil Ummaheh</b><br><small style="color:var(--muted)">Nama dan foto akan tampil di Overview.</small></div></div><div class="formgrid"><div class="field"><label>NAMA SAPAAN</label><input id="nameInput" value="${escapeHTML(db.profile.name)}" placeholder="Nama kamu"></div><div class="field"><label>FOTO PROFIL</label><input id="photoInput" type="file" accept="image/*"></div></div><button class="btn primary" onclick="saveProfile()">Simpan Profil</button><div><h2>Tema</h2><div class="theme"><button class="${db.profile.theme==='pink'?'selected':''}" onclick="theme('pink')">🌸 Pink</button><button class="${db.profile.theme==='dark'?'selected':''}" onclick="theme('dark')">🌙 Dark</button><button class="${db.profile.theme==='classic'?'selected':''}" onclick="theme('classic')">☁️ Classic</button></div></div><div class="two"><div><h2>Kategori Pemasukan</h2>${catEditor("incomeCats")}</div><div><h2>Kategori Pengeluaran</h2>${catEditor("expenseCats")}</div></div><div><h2>Data</h2><button class="btn" onclick="exportData()">Backup JSON</button> <button class="btn" onclick="document.getElementById('importFile').click()">Import JSON</button> <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)"> <button class="btn danger" onclick="resetAll()">Hapus Semua Data</button></div></div>`}
function catEditor(key){return `<div class="list">${db[key].map((c,i)=>`<div class="row"><span class="pill">${escapeHTML(c)}</span><button class="btn danger" onclick="removeCat('${key}',${i})">×</button></div>`).join("")}</div><form class="toolbar" onsubmit="addCat(event,'${key}')"><input name="cat" placeholder="Kategori baru" style="flex:1;min-width:120px;padding:10px;border:1px solid var(--line);border-radius:11px;color:var(--text);background:var(--card)"><button class="btn primary">Tambah</button></form>`}
function toggleQuickAdd(){const menu=document.getElementById("quickAddMenu");menu.hidden=!menu.hidden}
function openQuickTransaction(type){document.getElementById("quickAddMenu").hidden=true;current=type;render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const menu=document.getElementById("quickAddMenu"),fab=document.getElementById("fabAdd");if(menu&&!menu.hidden&&!menu.contains(e.target)&&e.target!==fab)menu.hidden=true});
function render(){nav();let dateEl=document.getElementById("todayLabel");if(dateEl)dateEl.textContent=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short"});document.documentElement.dataset.theme=db.profile.theme;let p=document.getElementById("page");if(current==="overview")p.innerHTML=overview();else if(current==="bank")p.innerHTML=bankPage();else if(current==="income")p.innerHTML=transactionPage("income");else if(current==="expense")p.innerHTML=transactionPage("expense");else if(current==="saving")p.innerHTML=savingPage();else if(current==="debt")p.innerHTML=debtPage();else p.innerHTML=settings()}
function addTx(e,type){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount')),bankIndex=Number(f.get('bankIndex')),date=String(f.get('date')||"");if(!Number.isFinite(amount)||amount<=0||!Number.isInteger(bankIndex)||!db.banks[bankIndex]){alert('Nominal atau rekening tidak valid.');return}if(!validISODate(date)){alert('Tanggal tidak valid. Pilih tanggal kalender yang benar.');return}if(type==='expense'&&amount>bankBalance(bankIndex)){if(!confirm('Nominal pengeluaran melebihi saldo rekening ini. Tetap simpan? Saldo akan menjadi minus.'))return}db.transactions.push({type,amount,date,category:f.get('category'),title:f.get('title'),bankIndex,accountKind:"bank"});save();toast('Transaksi tersimpan; saldo rekening diperbarui');render()}
function changeSavingBalance(index,delta){if(Number.isInteger(index)&&db.savings[index])db.savings[index].balance=Math.max(0,Number(db.savings[index].balance||0)+delta)}
function editTx(i){
 const x=db.transactions[i];if(!x)return;const paired=x.pairId?db.transactions.filter(t=>t.pairId===x.pairId):[];const isTransfer=x.type==="transfer_out"||x.type==="transfer_in";
 let amount=prompt("Ubah nominal (Rp)",x.amount);if(amount===null)return;if(amount.trim()===""||!Number.isFinite(Number(amount))||Number(amount)<=0){alert("Nominal harus lebih dari 0.");return}
 let title=prompt("Ubah judul/keterangan",x.title||"");if(title===null)return;let date=prompt("Ubah tanggal (YYYY-MM-DD)",x.date);if(date===null)return;if(!validISODate(date)){alert("Tanggal tidak valid. Gunakan tanggal kalender yang benar dalam format YYYY-MM-DD.");return}
 let category=x.category||"Lainnya";if(!isTransfer){const cats=x.type==="income"?db.incomeCats:db.expenseCats;category=prompt("Ubah kategori ("+cats.join(", ")+")",x.category);if(category===null)return;category=category.trim()||cats[0]}
 let bi=Number(x.bankIndex),newBi=bi;if(x.accountKind!=="saving"){const choice=prompt("Rekening/metode (nomor sesuai daftar: "+db.banks.map((b,j)=>(j+1)+". "+b.name).join(", ")+")",String((Number(x.bankIndex)||0)+1));if(choice===null)return;newBi=Number(choice)-1;if(!db.banks[newBi]){alert("Pilihan rekening tidak valid.");return}}
 const newAmount=Number(amount),delta=newAmount-Number(x.amount||0);
 if(isTransfer&&paired.length>1){paired.forEach(t=>{if(t.accountKind==="saving")changeSavingBalance(t.savingIndex,(t.type==="transfer_in"?1:-1)*delta);t.amount=newAmount;t.date=date;t.title=title.trim()||t.title;t.category=category});if(x.accountKind!=="saving"&&newBi!==bi)x.bankIndex=newBi;}
 else{if(isTransfer&&paired.length<=1&&!confirm("Transaksi transfer lama tidak memiliki pasangan yang terhubung. Perubahan hanya diterapkan ke catatan yang dipilih. Lanjutkan?"))return;x.amount=newAmount;x.title=title.trim();x.date=date;x.category=category;x.bankIndex=newBi;}
 save();toast(isTransfer?"Transaksi transfer diperbarui":"Transaksi berhasil diedit; saldo diperbarui");render()
}
function delTx(i){const x=db.transactions[i];if(!x)return;const paired=x.pairId?db.transactions.filter(t=>t.pairId===x.pairId):[];if(!confirm(paired.length>1?"Hapus transaksi ini beserta pasangan transfernya?":"Hapus transaksi ini?"))return;const removing=paired.length>1?paired:[x];removing.forEach(t=>{if(t.accountKind==="saving")changeSavingBalance(t.savingIndex,(t.type==="transfer_in"?-1:1)*Number(t.amount||0))});db.transactions=db.transactions.filter(t=>!removing.includes(t));save();render()}
function addBank(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get("name")||"").trim(),balance=Number(f.get("balance"));if(!name){alert("Nama rekening wajib diisi.");return}if(db.banks.some(b=>b.name.trim().toLowerCase()===name.toLowerCase())){alert("Nama rekening sudah digunakan. Pilih nama yang berbeda.");return}if(!Number.isFinite(balance)||balance<0){alert("Saldo awal harus nol atau lebih.");return}db.banks.push({name:name.slice(0,80),balance});save();render()}
function deleteBank(i){const b=db.banks[i];if(!b)return;if(db.banks.length<=1){alert("Minimal harus ada satu rekening/dompet.");return}const refs=db.transactions.filter(t=>t.accountKind!=="saving"&&Number(t.bankIndex)===i);if(refs.length){alert("Rekening ini masih memiliki "+refs.length+" catatan transaksi. Agar riwayat dan saldo tidak rusak, hapus atau catat ulang transaksi terkait terlebih dahulu.");return}if(!confirm("Hapus rekening "+b.name+"? Rekening ini tidak memiliki transaksi yang terhubung."))return;db.banks.splice(i,1);db.transactions.forEach(t=>{if(t.accountKind!=="saving"&&Number(t.bankIndex)>i)t.bankIndex--;if(Number.isInteger(t.transferToIndex)&&t.transferToIndex>i)t.transferToIndex--});save();render()}
function editBank(i){const b=db.banks[i];if(!b)return;const currentBalance=bankBalance(i);let v=prompt("Saldo awal historis rekening "+b.name+" (Rp). Saldo saat ini setelah perubahan akan dihitung dari riwayat transaksi.",b.balance);if(v===null)return;if(v.trim()===""||!Number.isFinite(Number(v))||Number(v)<0){alert("Saldo awal tidak valid.");return}const opening=Number(v),preview=currentBalance+(opening-Number(b.balance||0));if(!confirm("Saldo awal berubah dari "+rupiah(b.balance)+" menjadi "+rupiah(opening)+".\nSaldo saat ini akan menjadi "+rupiah(preview)+", karena seluruh riwayat transaksi tetap diperhitungkan. Terapkan perubahan?"))return;b.balance=opening;save();render()}
function transferWallet(e){e.preventDefault();const f=new FormData(e.target),from=Number(f.get("from")),to=Number(f.get("to")),amount=Number(f.get("amount")),title=String(f.get("title")||"Pindah saldo").trim();if(!db.banks[from]||!db.banks[to]||from===to){alert("Pilih rekening asal dan tujuan yang berbeda.");return}if(!Number.isFinite(amount)||amount<=0){alert("Nominal harus lebih dari 0.");return}if(amount>bankBalance(from)){alert("Saldo rekening asal tidak mencukupi.");return}const pairId="tr-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),date=localISODate();db.transactions.push({type:"transfer_out",amount,date,category:"Transfer antar dompet",title:title+" — ke "+db.banks[to].name,bankIndex:from,accountKind:"bank",pairId,transferToIndex:to});db.transactions.push({type:"transfer_in",amount,date,category:"Transfer antar dompet",title:title+" — dari "+db.banks[from].name,bankIndex:to,accountKind:"bank",pairId,transferToIndex:from});save();toast("Saldo berhasil dipindahkan dan sumbernya tercatat");render()}
function editBank(i){let v=prompt("Saldo "+db.banks[i].name,db.banks[i].balance);if(v!==null&&v.trim()!==""&&Number.isFinite(Number(v))&&Number(v)>=0){db.banks[i].balance=Number(v);save();render()}else if(v!==null){alert("Saldo awal tidak valid.")}}
function editSaving(i){let s=db.savings[i];if(!s)return;let name=prompt("Nama tabungan",s.name);if(name===null)return;let target=prompt("Target tabungan (Rp)",s.target);if(target===null)return;let balance=prompt("Saldo tabungan saat ini (Rp)",s.balance);if(balance===null)return;if(!name.trim()||!Number.isFinite(Number(target))||Number(target)<0||!Number.isFinite(Number(balance))||Number(balance)<0){alert("Nama atau nominal tabungan tidak valid.");return}s.name=name.trim();s.target=Number(target);s.balance=Number(balance);save();toast("Tabungan berhasil diperbarui");render()}
function delSaving(i){if(confirm("Hapus tabungan ini? Data saldo dan target tabungan ini akan dihapus.")){db.savings.splice(i,1);save();render()}}
function addSaving(i){const saving=db.savings[i];if(!saving)return;let v=prompt("Jumlah setoran ke "+saving.name+" (Rp)",100000);if(v===null)return;const amount=Number(v);if(!v.trim()||!Number.isFinite(amount)||amount<=0){alert("Jumlah setoran harus lebih dari 0.");return}let choice=prompt("Setor dari rekening nomor:\n"+db.banks.map((b,j)=>(j+1)+". "+b.name+" — saldo "+rupiah(bankBalance(j))).join("\n"),"1");if(choice===null)return;const bi=Number(choice)-1;if(!Number.isInteger(bi)||!db.banks[bi]){alert("Rekening tidak valid.");return}if(amount>bankBalance(bi)){alert("Rekening sumber tidak mencukupi.");return}const pairId="sv-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),date=localISODate();db.transactions.push({type:"transfer_out",amount,date,category:"Setoran tabungan",title:"Setoran: "+saving.name+" — dari "+db.banks[bi].name,bankIndex:bi,accountKind:"bank",pairId,transferToIndex:null});db.transactions.push({type:"transfer_in",amount,date,category:"Setoran tabungan",title:"Setoran: "+saving.name,bankIndex:-1,accountKind:"saving",savingIndex:i,pairId,transferToIndex:bi});saving.balance+=amount;save();toast("Setoran tercatat sebagai pasangan transaksi");render()}
function withdrawSaving(i){const saving=db.savings[i];if(!saving)return;let v=prompt("Jumlah penarikan dari "+saving.name+" (Rp)",100000);if(v===null)return;const amount=Number(v);if(!v.trim()||!Number.isFinite(amount)||amount<=0){alert("Jumlah penarikan harus lebih dari 0.");return}if(amount>Number(saving.balance)){alert("Saldo tabungan tidak mencukupi.");return}let choice=prompt("Masukkan ke rekening nomor:\n"+db.banks.map((b,j)=>(j+1)+". "+b.name+" — saldo "+rupiah(bankBalance(j))).join("\n"),"1");if(choice===null)return;const bi=Number(choice)-1;if(!Number.isInteger(bi)||!db.banks[bi]){alert("Rekening tujuan tidak valid.");return}const pairId="sv-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),date=localISODate();db.transactions.push({type:"transfer_out",amount,date,category:"Penarikan tabungan",title:"Penarikan: "+saving.name,bankIndex:-1,accountKind:"saving",savingIndex:i,pairId,transferToIndex:bi});db.transactions.push({type:"transfer_in",amount,date,category:"Penarikan tabungan",title:"Penarikan: "+saving.name+" — ke "+db.banks[bi].name,bankIndex:bi,accountKind:"bank",pairId,transferToIndex:null});saving.balance-=amount;save();toast("Penarikan tercatat sebagai pasangan transaksi");render()}
function addSavingTarget(e){e.preventDefault();let f=new FormData(e.target);let target=Number(f.get("target"));if(!Number.isFinite(target)||target<=0){alert("Target harus lebih dari 0.");return}db.savings.push({name:String(f.get("name")).trim(),target,balance:0});save();render()}
function addDebt(e){e.preventDefault();let f=new FormData(e.target);let amount=Number(f.get("amount"));if(!Number.isFinite(amount)||amount<=0){alert("Nominal hutang harus lebih dari 0.");return}db.debts.push({name:String(f.get("name")).trim(),amount,due:f.get("due")});save();render()}
function addSub(e){e.preventDefault();let f=new FormData(e.target);let amount=Number(f.get("amount"));if(!Number.isFinite(amount)||amount<=0){alert("Nominal langganan harus lebih dari 0.");return}db.subscriptions.push({name:String(f.get("name")).trim(),amount,period:f.get("period"),due:f.get("due")});save();render()}
function chooseSource(amount,label){const choice=prompt("Pilih sumber saldo untuk "+label+":\n"+db.banks.map((b,i)=>(i+1)+". "+b.name+" — saldo "+rupiah(bankBalance(i))).join("\n"),"1");if(choice===null)return null;const bi=Number(choice)-1;if(!Number.isInteger(bi)||!db.banks[bi]){alert("Pilihan rekening tidak valid.");return null}if(amount>bankBalance(bi)){alert("Saldo "+db.banks[bi].name+" tidak mencukupi. Pilih sumber lain atau isi saldo terlebih dahulu.");return null}return bi}
function payDebt(i){const d=db.debts[i];if(!d||d.paid)return;if(!confirm("Bayar "+d.name+" sebesar "+rupiah(d.amount)+"? Saldo rekening yang dipilih akan berkurang."))return;const bi=chooseSource(Number(d.amount),d.name);if(bi===null)return;db.transactions.push({type:"expense",amount:Number(d.amount),date:localISODate(),category:"Tagihan/Hutang",title:"Pembayaran: "+d.name,bankIndex:bi});d.paid=true;d.paidFrom=bi;save();toast("Tagihan dibayar dari "+db.banks[bi].name);render()}
function paySub(i){const sub=db.subscriptions[i];if(!sub)return;const period=String(sub.due||"").slice(0,7);if(sub.paidPeriod===period){alert("Langganan ini sudah dibayar untuk periode tagihan tersebut.");return}if(!confirm("Bayar langganan "+sub.name+" sebesar "+rupiah(sub.amount)+"? Saldo rekening yang dipilih akan berkurang."))return;const bi=chooseSource(Number(sub.amount),sub.name);if(bi===null)return;db.transactions.push({type:"expense",amount:Number(sub.amount),date:localISODate(),category:"Langganan",title:"Pembayaran langganan: "+sub.name,bankIndex:bi});sub.paidPeriod=period;save();toast("Langganan dibayar dari "+db.banks[bi].name);render()}
function editDebt(i){const d=db.debts[i];if(!d)return;const name=prompt("Nama tagihan/hutang",d.name);if(name===null)return;const amount=prompt("Nominal (Rp)",d.amount);if(amount===null)return;const due=prompt("Jatuh tempo (YYYY-MM-DD)",d.due);if(due===null)return;if(!name.trim()||!Number.isFinite(Number(amount))||Number(amount)<=0||!validISODate(due)){alert("Data tagihan tidak valid.");return}d.name=name.trim();d.amount=Number(amount);d.due=due;save();render()}
function delDebt(i){const d=db.debts[i];if(d&&confirm("Hapus tagihan "+d.name+"? Riwayat transaksi yang sudah tercatat tidak ikut terhapus.")){db.debts.splice(i,1);save();render()}}
function editSub(i){const sub=db.subscriptions[i];if(!sub)return;const name=prompt("Nama langganan",sub.name);if(name===null)return;const amount=prompt("Nominal (Rp)",sub.amount);if(amount===null)return;const period=prompt("Periode (Bulanan/Tahunan)",sub.period);if(period===null)return;const due=prompt("Tanggal tagihan (YYYY-MM-DD)",sub.due);if(due===null)return;if(!name.trim()||!Number.isFinite(Number(amount))||Number(amount)<=0||!validISODate(due)||!['Bulanan','Tahunan'].includes(period)){alert("Data langganan tidak valid.");return}sub.name=name.trim();sub.amount=Number(amount);sub.period=period;sub.due=due;save();render()}
function delSub(i){const sub=db.subscriptions[i];if(sub&&confirm("Hapus langganan "+sub.name+"? Riwayat pembayaran yang sudah tercatat tidak ikut terhapus.")){db.subscriptions.splice(i,1);save();render()}}
function saveProfile(){
  db.profile.name=(document.getElementById("nameInput").value||"Umma").trim().slice(0,80)||"Umma";
  let file=document.getElementById("photoInput").files[0];
  if(file){if(!file.type.startsWith("image/")){alert("Pilih file gambar yang valid.");return}if(file.size>2*1024*1024){alert("Ukuran foto maksimal 2 MB.");return}
    let r=new FileReader();r.onload=()=>{db.profile.photo=r.result;save();render()};r.onerror=()=>alert("Foto gagal dibaca.");r.readAsDataURL(file)
  }else{save();render()}
}
function theme(t){db.profile.theme=t;applyTheme();save();render()}
function applyTheme(){let t=db.profile.theme,r=document.documentElement;if(t==="dark"){r.style.setProperty("--bg","#111827");r.style.setProperty("--card","#1f2937");r.style.setProperty("--text","#f3f4f6");r.style.setProperty("--muted","#9ca3af");r.style.setProperty("--line","#374151");r.style.setProperty("--soft","#273449");r.style.setProperty("--primary","#60a5fa");r.style.setProperty("--primary2","#93c5fd");r.style.setProperty("--shadow","0 8px 24px rgba(0,0,0,.18)")}else if(t==="classic"){r.style.setProperty("--bg","#f5f7f6");r.style.setProperty("--card","#fff");r.style.setProperty("--text","#24302b");r.style.setProperty("--muted","#74817b");r.style.setProperty("--line","#dce4df");r.style.setProperty("--soft","#eaf1ed");r.style.setProperty("--primary","#5c7c6d");r.style.setProperty("--primary2","#405d50")}else{r.style.setProperty("--bg","#fff7fb");r.style.setProperty("--card","#fff");r.style.setProperty("--text","#30232b");r.style.setProperty("--muted","#8d7783");r.style.setProperty("--line","#f1d9e6");r.style.setProperty("--soft","#fce6f2");r.style.setProperty("--primary","#d95b9a");r.style.setProperty("--primary2","#b83f7c")}}
function addCat(e,key){e.preventDefault();let f=new FormData(e.target),c=(f.get("cat")||"").trim();if(c&&!db[key].includes(c)){db[key].push(c);save();render()}}
function removeCat(key,i){if(db[key].length>1){db[key].splice(i,1);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ummaheh-backup.json";a.click()}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  if(f.size>5*1024*1024){alert("File backup terlalu besar (maksimal 5 MB).");e.target.value="";return}
  const r=new FileReader();
  r.onload=()=>{try{
    const candidate=normalizeDB(JSON.parse(r.result));
    if(!confirm("Impor backup akan mengganti data saat ini. Pastikan sudah membuat backup terbaru. Lanjutkan?"))return;
    const old=db;db=candidate;if(save()){applyTheme();render();toast("Backup berhasil diimpor")}else{db=old;render()}
  }catch(err){console.error(err);alert("File backup tidak valid atau strukturnya tidak sesuai.")}finally{e.target.value=""}};
  r.onerror=()=>{alert("File backup gagal dibaca.");e.target.value=""};r.readAsText(f)
}
function resetAll(){if(confirm("Hapus seluruh data Ummaheh? Tindakan ini tidak dapat dibatalkan tanpa backup.")){exportData();localStorage.removeItem(KEY);location.reload()}}
applyTheme();render();
</script>
